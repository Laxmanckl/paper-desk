<title>XAU · EUR Paper Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a trading-desk sheet. Summary strip, equity curve, one panel per instrument, then the ledger. */
:root {
  --bg: #f5f6f4; --panel: #ffffff; --ink: #1c2126; --ink-2: #4c5560; --ink-3: #7c8590;
  --rule: #dde1e3; --grid: #eceff0; --accent: #2f5d7c;
  --xau: #b07a00; --eur: #2a78d6;
  --good: #0f8a1f; --bad: #c43535; --warn-bg: #fbe8b4; --warn-ink: #6b4b00;
  --good-bg: #e2f2e1; --bad-bg: #f8e2e0; --hold-bg: #eceef0;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121518; --panel: #1a1e22; --ink: #e6e9ec; --ink-2: #aab2ba; --ink-3: #7f8892;
  --rule: #2c3238; --grid: #23282d; --accent: #7fb0d3;
  --xau: #c98500; --eur: #3987e5;
  --good: #3fbf4f; --bad: #ec6a6a; --warn-bg: #3d3110; --warn-ink: #f3cf6e;
  --good-bg: #173320; --bad-bg: #3a1c1c; --hold-bg: #262b30; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121518; --panel: #1a1e22; --ink: #e6e9ec; --ink-2: #aab2ba; --ink-3: #7f8892;
  --rule: #2c3238; --grid: #23282d; --accent: #7fb0d3;
  --xau: #c98500; --eur: #3987e5;
  --good: #3fbf4f; --bad: #ec6a6a; --warn-bg: #3d3110; --warn-ink: #f3cf6e;
  --good-bg: #173320; --bad-bg: #3a1c1c; --hold-bg: #262b30; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 20px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
h1, h2 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; letter-spacing: .01em; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.muted { color: var(--ink-3); }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.paper { font-family: var(--f-num); font-size: 11px; font-weight: 500; letter-spacing: .06em; padding: 3px 8px; border-radius: 3px;
  color: var(--warn-ink); background: repeating-linear-gradient(135deg, var(--warn-bg) 0 6px, transparent 6px 9px), var(--warn-bg); border: 1px solid var(--warn-ink); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--good); }
.dot.stale { background: var(--bad); }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 10px 14px; font-size: 13px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
.stat { padding: 14px 16px; display: grid; gap: 4px; border-left: 1px solid var(--rule); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 500; }
.stat .s { font-size: 12px; color: var(--ink-3); }
.stat.hero .v { font-size: 26px; }
.pos { color: var(--good); } .neg { color: var(--bad); }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--f-num); font-size: 10.5px; fill: var(--ink-3); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-family: var(--f-num); font-size: 11.5px;
  padding: 5px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -10px; }

.instruments { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.inst-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sym { display: flex; align-items: center; gap: 8px; }
.sym .swatch { width: 10px; height: 10px; border-radius: 2px; }
.sym b { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.price { font-family: var(--f-num); font-size: 22px; font-weight: 500; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-family: var(--f-num); font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 3px; background: var(--hold-bg); color: var(--ink-2); }
.chip.buy { background: var(--good-bg); color: var(--good); }
.chip.sell { background: var(--bad-bg); color: var(--bad); }
.chip.exec { border: 1px solid currentColor; background: transparent; color: var(--ink); }
.position { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.position div { display: grid; gap: 2px; min-width: 0; }
.position .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.flat { border-top: 1px solid var(--rule); padding-top: 12px; color: var(--ink-3); font-size: 13px; }
.bar { height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ink-3); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
td.l, th.l { font-family: var(--f-body); }
th.r, td.r { text-align: right; }
.log { display: grid; gap: 0; font-size: 12.5px; max-height: 340px; overflow-y: auto; }
.log div { display: grid; grid-template-columns: 118px 1fr; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--grid); }
.log time { font-family: var(--f-num); color: var(--ink-3); font-size: 11.5px; }
.log span { min-width: 0; overflow-wrap: anywhere; }
.empty { padding: 28px 8px; text-align: center; color: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid currentColor; }
.legend i.dash { border-top-style: dashed; border-top-width: 2px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; padding: 4px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button:focus-visible, .filters select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.filters label { display: inline-flex; align-items: center; gap: 6px; }
.filters select { font: inherit; font-size: 12.5px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); color: var(--ink); }
.filters .tot { margin-left: auto; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .filters .tot { margin-left: 0; width: 100%; } }
footer { font-size: 12px; color: var(--ink-3); display: grid; gap: 6px; }
footer .rules { display: flex; flex-wrap: wrap; gap: 4px 18px; }
@media (max-width: 520px) {
  .stat { border-left: 0; border-top: 1px solid var(--rule); }
  .stat:first-child { border-top: 0; }
  .log div { grid-template-columns: 1fr; gap: 0; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="title-row"><h1>XAU · EUR Paper Desk</h1><span class="paper">PAPER · FAKE MONEY</span></div>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section class="summary" id="summary" aria-label="Account summary"></section>

  <section class="card">
    <div class="card-head"><h2>Account equity</h2><span class="label" id="eq-range"></span></div>
    <div class="legend" id="eq-legend"></div>
    <div class="chart" id="equity-chart"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Profit &amp; loss</h2>
      <div class="seg" role="group" aria-label="Group profit and loss by">
        <button type="button" id="pnl-day" aria-pressed="true">Daily</button><button type="button" id="pnl-week" aria-pressed="false">Weekly</button>
      </div>
    </div>
    <div class="chart" id="pnl-chart"></div>
  </section>

  <section class="instruments" id="instruments"></section>

  <section class="card" id="research">
    <div class="card-head"><h2>Research loop</h2><span class="label">predict · test honestly · paper · review · remember</span></div>
    <div id="rl-box"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Closed trades</h2><span class="label" id="trade-count"></span></div>
    <div class="filters" id="filters" hidden>
      <label for="f-pair">Pair <select id="f-pair"><option value="">All</option><option value="XAUUSD">Gold</option><option value="EURUSD">EUR/USD</option></select></label>
      <label for="f-side">Side <select id="f-side"><option value="">All</option><option value="BUY">Buy</option><option value="SELL">Sell</option></select></label>
      <label for="f-result">Result <select id="f-result"><option value="">All</option><option value="win">Winners</option><option value="loss">Losers</option></select></label>
      <span class="tot" id="f-total"></span>
    </div>
    <div class="table-wrap" id="trades"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Activity</h2><span class="label">newest first</span></div>
    <div class="log" id="log"></div>
  </section>

  <footer>
    <div class="rules" id="rules"></div>
    <div>Paper trading only: real prices, simulated fills, no broker and no real orders. Not financial advice.</div>
  </footer>
</div>

<!--__RESEARCH__-->
<script type="application/json" id="desk-data">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("desk-data").textContent);
  var A = D.account;
  var SPEC = D.instruments;
  var NAMES = { XAUUSD: "Gold", EURUSD: "Euro" };
  var COLOR = { XAUUSD: "var(--xau)", EURUSD: "var(--eur)" };
  var SYMS = Object.keys(SPEC);
  var $ = function (id) { return document.getElementById(id); };

  function money(v, sign) {
    var s = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (v < 0 ? "−$" : (sign && v > 0 ? "+$" : "$")) + s;
  }
  function pct(v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(2) + "%"; }
  function px(sym, v) { var d = SPEC[sym] ? SPEC[sym].digits : 2; return Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function cls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function ago(iso) {
    var m = (Date.now() - new Date(iso).getTime()) / 60000;
    if (m < 1) return "just now"; if (m < 60) return Math.round(m) + " min ago";
    if (m < 48 * 60) return Math.round(m / 60) + " h ago"; return Math.round(m / 1440) + " days ago";
  }
  function stamp(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }
  function exitFill(p, price) { var h = SPEC[p.symbol].spread / 2; return p.side === "BUY" ? price - h : price + h; }
  function pnlOf(p, price) { return (exitFill(p, price) - p.entry) * (p.side === "BUY" ? 1 : -1) * p.units; }
  function riskOf(t) { return Math.abs(t.entry - t.stop) * t.units; }

  // ---- derived numbers ----
  var openPnl = 0;
  Object.keys(A.positions).forEach(function (s) { var lp = A.last_price[s]; if (lp) openPnl += pnlOf(A.positions[s], lp.price); });
  var equity = A.cash + openPnl;
  var ret = equity / A.start_equity - 1;
  var closed = A.closed || [];
  var wins = closed.filter(function (t) { return t.pnl > 0; });
  var peak = A.start_equity, mdd = 0;
  (A.equity_log || []).forEach(function (pt) { peak = Math.max(peak, pt[1]); mdd = Math.max(mdd, (peak - pt[1]) / peak); });
  var lastCheck = A.last_check || (A.equity_log && A.equity_log.length ? A.equity_log[A.equity_log.length - 1][0] : null);
  var R = A.runner || {};
  var isServer = R.kind === "server";
  var RUNNER_LABEL = { server: "Always-on server", github: "GitHub, hourly", computer: "Own computer" };
  var staleLimit = isServer ? 45 : 180;      // minutes before the dot turns red

  // ---- header ----
  var staleMin = lastCheck ? (Date.now() - new Date(lastCheck).getTime()) / 60000 : Infinity;
  var meta = [];
  meta.push('<span><span class="dot' + (staleMin > staleLimit ? " stale" : "") + '"></span>' +
    (lastCheck ? "Last check " + ago(lastCheck) : "Waiting for the first check") + "</span>");
  meta.push("<span>Runner: " + esc(RUNNER_LABEL[R.kind] || "GitHub, hourly") +
    (isServer && R.every_min ? " · checks every " + (R.every_min === 1 ? "minute" : R.every_min + " min") +
      ", page updates every ~15 min" : "") + "</span>");
  meta.push("<span>Prices: " + esc(D.source_label) + "</span>");
  meta.push("<span>Running since " + esc((A.created || "").slice(0, 10)) + "</span>");
  if (D.has_scalper) meta.push('<a href="scalper.html" style="color:var(--accent)">Scalper desk →</a>');
  $("meta").innerHTML = meta.join("");
  if (D.preview) {
    $("banner").hidden = false;
    $("banner").textContent = "Preview with simulated prices. Your own dashboard shows real gold and EUR/USD prices once the bot runs on GitHub.";
  } else if (D.note) {
    $("banner").hidden = false;
    $("banner").textContent = D.note;
  } else if (lastCheck && staleMin > staleLimit) {
    $("banner").hidden = false;
    $("banner").textContent = isServer
      ? "The server has not checked in for " + (staleMin < 120 ? Math.round(staleMin) + " minutes" : Math.round(staleMin / 60) + " hours") + ". Log in to the server and run: sudo systemctl status paper-desk"
      : "No check in the last " + Math.round(staleMin / 60) + " hours. On weekends forex is closed; otherwise open the Actions tab on GitHub to see why the bot stopped.";
  }

  // ---- summary ----
  var stats = [
    ["hero", "Equity", money(equity), "<span class='" + cls(ret) + "'>" + pct(ret) + "</span> from " + money(A.start_equity)],
    ["", "Open P&L", "<span class='" + cls(openPnl) + "'>" + money(openPnl, true) + "</span>", Object.keys(A.positions).length + " open position" + (Object.keys(A.positions).length === 1 ? "" : "s")],
    ["", "Realised", "<span class='" + cls(A.cash - A.start_equity) + "'>" + money(A.cash - A.start_equity, true) + "</span>", closed.length + " closed trade" + (closed.length === 1 ? "" : "s")],
    ["", "Win rate", closed.length ? Math.round(100 * wins.length / closed.length) + "%" : "–", closed.length ? wins.length + " won · " + (closed.length - wins.length) + " lost" : "no closed trades yet"],
    ["", "Max drawdown", (mdd * 100).toFixed(2) + "%", "worst drop from a peak"]
  ];
  (function () {
    var now = [new Date().toISOString(), equity, {}];
    SYMS.forEach(function (s) { if (A.last_price[s]) now[2][s] = A.last_price[s].price; });
    var bench = SYMS.filter(function (s) { return (A.bench_start || {})[s]; }).map(function (s) {
      var p0 = A.bench_start[s], p = now[2][s]; return { s: s, r: p0 && p ? p / p0 - 1 : 0 };
    });
    if (!bench.length) return;
    var beat = bench.filter(function (b) { return ret > b.r; });
    var verdict = beat.length === bench.length ? "Yes, both" : beat.length ? "Only " + (beat[0].s === "XAUUSD" ? "gold" : "EUR/USD") : "Not yet";
    stats.splice(1, 0, ["", "Beating buy &amp; hold?", verdict,
      bench.map(function (b) { return (b.s === "XAUUSD" ? "Gold" : "EUR/USD") + " held <span class='" + cls(b.r) + "'>" + pct(b.r) + "</span>"; }).join(" · ")]);
  })();
  $("summary").innerHTML = stats.map(function (s) {
    return '<div class="stat ' + s[0] + '"><span class="label">' + s[1] + '</span><span class="v">' + s[2] + '</span><span class="s">' + s[3] + "</span></div>";
  }).join("");

  // ---- charts (hand-drawn SVG, redrawn on resize) ----
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function niceTicks(lo, hi, n) {
    var span = hi - lo || Math.abs(hi) || 1, step = Math.pow(10, Math.floor(Math.log10(span / n)));
    var err = span / n / step; step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
    var t = [], v = Math.ceil(lo / step) * step;
    for (; v <= hi + step * 1e-9; v += step) t.push(+v.toPrecision(12));
    return t;
  }

  function lineChart(box, pts, opt) {
    // pts: [{x: Date|number, y: number, label: string}]
    box.innerHTML = "";
    if (pts.length < 2) { box.innerHTML = '<div class="empty">' + opt.empty + "</div>"; return; }
    var W = Math.max(280, box.clientWidth), H = opt.height, L = opt.left || 62, R = opt.right || 12, T = 10, B = 22;
    var xs = pts.map(function (p) { return +p.x; }), ys = pts.map(function (p) { return p.y; });
    var extra = (opt.levels || []).map(function (l) { return l.y; }).concat(opt.baseline != null ? [opt.baseline] : []);
    (opt.series || []).forEach(function (sr) { sr.pts.forEach(function (p) { extra.push(p.y); }); });
    var lo = Math.min.apply(null, ys.concat(extra)), hi = Math.max.apply(null, ys.concat(extra));
    var pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.01 || 1; lo -= pad; hi += pad;
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var sx = function (v) { return L + (W - L - R) * (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)); };
    var sy = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "img", "aria-label": opt.aria }, box);
    niceTicks(lo, hi, 4).forEach(function (t) {
      el("line", { x1: L, x2: W - R, y1: sy(t), y2: sy(t), stroke: "var(--grid)", "stroke-width": 1 }, svg);
      el("text", { x: L - 8, y: sy(t) + 3.5, "text-anchor": "end" }, svg).textContent = opt.yfmt(t);
    });
    var xmid = (x0 + x1) / 2, mid = pts.reduce(function (b, p) { return Math.abs(+p.x - xmid) < Math.abs(+b.x - xmid) ? p : b; }, pts[0]);
    var seen = {};
    [[pts[0], "start"], [pts[pts.length - 1], "end"], [mid, "middle"]].forEach(function (e) {
      var txt = opt.xfmt(e[0].x);
      if (seen[txt]) return;                        // never print the same date twice
      seen[txt] = 1;
      el("text", { x: sx(+e[0].x), y: H - 5, "text-anchor": e[1] }, svg).textContent = txt;
    });
    if (opt.baseline != null) {
      el("line", { x1: L, x2: W - R, y1: sy(opt.baseline), y2: sy(opt.baseline), stroke: "var(--ink-3)", "stroke-dasharray": "3 4", "stroke-width": 1 }, svg);
    }
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + sx(+p.x).toFixed(1) + " " + sy(p.y).toFixed(1); }).join("");
    if (opt.area) {
      var base = sy(opt.baseline != null ? opt.baseline : lo);
      el("path", { d: d + "L" + sx(x1) + " " + base + "L" + sx(x0) + " " + base + "Z", fill: opt.color, opacity: 0.1 }, svg);
    }
    // level lines, labels nudged apart so close levels never overprint
    var lv = (opt.levels || []).slice().sort(function (a, b) { return sy(a.y) - sy(b.y); });
    var lastY = -Infinity;
    lv.forEach(function (l) {
      el("line", { x1: L, x2: W - R, y1: sy(l.y), y2: sy(l.y), stroke: l.color, "stroke-width": 1.5, "stroke-dasharray": l.dash || "" }, svg);
      var ly = Math.max(sy(l.y) - 4, lastY + 12); lastY = ly;
      var bg = el("rect", { y: ly - 9, height: 12, fill: "var(--panel)", opacity: 0.85 }, svg);
      var tx = el("text", { x: W - R - 2, y: ly, "text-anchor": "end" }, svg);
      tx.textContent = l.label; tx.style.fill = l.color;
      var w = tx.getComputedTextLength ? tx.getComputedTextLength() : l.label.length * 6.3;
      bg.setAttribute("x", W - R - 4 - w); bg.setAttribute("width", w + 4);
    });
    (opt.series || []).forEach(function (sr) {
      if (sr.pts.length < 2) return;
      var sd = sr.pts.map(function (p, i) { return (i ? "L" : "M") + sx(+p.x).toFixed(1) + " " + sy(p.y).toFixed(1); }).join("");
      el("path", { d: sd, fill: "none", stroke: sr.color, "stroke-width": 1.75, "stroke-dasharray": "6 4", "stroke-linejoin": "round" }, svg);
    });
    el("path", { d: d, fill: "none", stroke: opt.color, "stroke-width": 2.25, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    var last = pts[pts.length - 1];
    el("circle", { cx: sx(+last.x), cy: sy(last.y), r: 4, fill: opt.color, stroke: "var(--panel)", "stroke-width": 2 }, svg);

    // hover crosshair + tooltip
    var cross = el("line", { y1: T, y2: H - B, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" }, svg);
    var dot = el("circle", { r: 4, fill: opt.color, stroke: "var(--panel)", "stroke-width": 2, visibility: "hidden" }, svg);
    var tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
    var hit = el("rect", { x: L, y: 0, width: W - L - R, height: H, fill: "transparent" }, svg);
    function move(ev) {
      var r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * W / r.width, best = 0, bd = Infinity;
      pts.forEach(function (p, i) { var dd = Math.abs(sx(+p.x) - mx); if (dd < bd) { bd = dd; best = i; } });
      var p = pts[best], cx = sx(+p.x), cy = sy(p.y);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");
      tip.hidden = false; tip.textContent = p.label;
      tip.style.left = Math.min(Math.max(cx * r.width / W, 70), r.width - 70) + "px"; tip.style.top = (cy * r.height / H) + "px";
    }
    function leave() { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.hidden = true; }
    hit.addEventListener("pointermove", move); hit.addEventListener("pointerleave", leave);
  }

  // buy-and-hold: what $10,000 would be worth holding each instrument from day one
  var BENCH = A.bench_start || {};
  function priceAt(sym, pt) {
    if (pt[2] && pt[2][sym]) return pt[2][sym];
    var log = A.equity_log || [];
    if (log.length && pt === log[log.length - 1] && A.last_price[sym]) return A.last_price[sym].price;   // latest point: current price
    var day = pt[0].slice(0, 10), c = (A.closes[sym] || []).filter(function (x) { return x[0] <= day; });
    return c.length ? c[c.length - 1][1] : BENCH[sym];
  }
  function holdValue(sym, pt) { var p0 = BENCH[sym], p = priceAt(sym, pt); return p0 && p ? A.start_equity * p / p0 : null; }
  var SHORT = { XAUUSD: "Gold", EURUSD: "EUR/USD" };

  function drawEquity() {
    var log = A.equity_log || [];
    var hold = SYMS.filter(function (s) { return BENCH[s]; });
    var pts = log.map(function (p) {
      var lab = stamp(p[0]) + "  Bot " + money(p[1]);
      hold.forEach(function (s) { var v = holdValue(s, p); if (v) lab += " · " + SHORT[s] + " hold " + money(v); });
      return { x: new Date(p[0]), y: p[1], label: lab };
    });
    var series = hold.map(function (s) {
      return { color: COLOR[s], pts: log.map(function (p) { return { x: new Date(p[0]), y: holdValue(s, p) }; }).filter(function (q) { return q.y; }) };
    });
    $("eq-legend").innerHTML = '<span style="color:var(--ink)"><i></i><span style="color:var(--ink-2)">Bot account</span></span>' +
      hold.map(function (s) { return '<span style="color:' + COLOR[s] + '"><i class="dash"></i><span style="color:var(--ink-2)">If you had just bought ' + SHORT[s] + "</span></span>"; }).join("");
    if (log.length) $("eq-range").textContent = stamp(log[0][0]) + " → " + stamp(log[log.length - 1][0]);
    lineChart($("equity-chart"), pts, {
      height: 230, color: "var(--ink)", area: true, baseline: A.start_equity, series: series, aria: "Bot account compared with buying and holding gold or EUR/USD",
      empty: "The equity curve appears after the first two checks.",
      yfmt: function (v) { return "$" + Math.round(v).toLocaleString("en-US"); },
      xfmt: function (d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
    });
  }

  // ---- profit & loss bars ----
  var pnlMode = "day";
  function localDay(iso) { var d = new Date(iso); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function pnlBuckets(mode) {
    var log = A.equity_log || [], out = [], prevEnd = A.start_equity;
    log.forEach(function (p) {
      var d = localDay(p[0]);
      if (mode === "week") { var dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); }
      var key = d.getTime();
      if (!out.length || out[out.length - 1].key !== key) out.push({ key: key, date: d, start: prevEnd });
      out[out.length - 1].end = p[1]; prevEnd = p[1];
    });
    out.forEach(function (b) { b.pnl = b.end - b.start; });
    return out.slice(-30);
  }
  function drawPnl() {
    var box = $("pnl-chart"); box.innerHTML = "";
    var bars = pnlBuckets(pnlMode).filter(function (b) {     // skip weekend days with no change
      return pnlMode === "week" || Math.abs(b.pnl) >= 0.005 || [0, 6].indexOf(b.date.getDay()) < 0;
    });
    if (!bars.length) { box.innerHTML = '<div class="empty">Daily profit and loss appears after the first day of trading.</div>'; return; }
    var W = Math.max(280, box.clientWidth), H = 190, L = 62, R = 12, T = 12, B = 24;
    var vals = bars.map(function (b) { return b.pnl; });
    var hi = Math.max(0, Math.max.apply(null, vals)), lo = Math.min(0, Math.min.apply(null, vals));
    if (hi === lo) { hi = 1; lo = -1; }
    var pad = (hi - lo) * 0.1; hi += pad; lo -= pad;
    var sy = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var slot = (W - L - R) / bars.length, bw = Math.max(4, Math.min(42, slot - 2));
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "img", "aria-label": (pnlMode === "week" ? "Weekly" : "Daily") + " profit and loss" }, box);
    niceTicks(lo, hi, 4).forEach(function (t) {
      el("line", { x1: L, x2: W - R, y1: sy(t), y2: sy(t), stroke: t === 0 ? "var(--ink-3)" : "var(--grid)", "stroke-width": 1 }, svg);
      el("text", { x: L - 8, y: sy(t) + 3.5, "text-anchor": "end" }, svg).textContent = (t < 0 ? "−$" : "$") + Math.abs(Math.round(t)).toLocaleString("en-US");
    });
    var tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
    var every = Math.ceil(bars.length / Math.max(2, Math.floor((W - L - R) / 64)));   // ~64px per date label
    bars.forEach(function (b, i) {
      var cx = L + slot * (i + 0.5), y0 = sy(0), y1 = sy(b.pnl), top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0));
      var r = Math.min(4, h / 2, bw / 2), up = b.pnl >= 0, x = cx - bw / 2;
      // rounded only at the data end, square on the zero line
      var path = up
        ? "M" + x + " " + (top + h) + "V" + (top + r) + "Q" + x + " " + top + " " + (x + r) + " " + top + "H" + (x + bw - r) + "Q" + (x + bw) + " " + top + " " + (x + bw) + " " + (top + r) + "V" + (top + h) + "Z"
        : "M" + x + " " + top + "V" + (top + h - r) + "Q" + x + " " + (top + h) + " " + (x + r) + " " + (top + h) + "H" + (x + bw - r) + "Q" + (x + bw) + " " + (top + h) + " " + (x + bw) + " " + (top + h - r) + "V" + top + "Z";
      el("path", { d: path, fill: up ? "var(--good)" : "var(--bad)" }, svg);
      var name = pnlMode === "week" ? "Week of " + b.date.toLocaleDateString("en-GB", { day: "numeric", month: "short" })
                                    : b.date.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      var last = bars.length - 1;
      if (i === last || (i % every === 0 && last - i >= Math.max(2, every * 0.75))) {
        el("text", { x: cx, y: H - 6, "text-anchor": "middle" }, svg).textContent = b.date.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      }
      var hit = el("rect", { x: L + slot * i, y: T, width: slot, height: H - T - B, fill: "transparent" }, svg);
      hit.addEventListener("pointerenter", function () {
        var rr = svg.getBoundingClientRect();
        tip.hidden = false; tip.textContent = name + "  " + money(b.pnl, true);
        tip.style.left = Math.min(Math.max(cx * rr.width / W, 70), rr.width - 70) + "px"; tip.style.top = (top * rr.height / H) + "px";
      });
      hit.addEventListener("pointerleave", function () { tip.hidden = true; });
    });
  }
  function setPnlMode(m) {
    pnlMode = m;
    $("pnl-day").setAttribute("aria-pressed", m === "day"); $("pnl-week").setAttribute("aria-pressed", m === "week");
    drawPnl();
  }
  $("pnl-day").addEventListener("click", function () { setPnlMode("day"); });
  $("pnl-week").addEventListener("click", function () { setPnlMode("week"); });

  // ---- instrument panels ----
  function instrumentPanel(sym) {
    var lp = A.last_price[sym], dec = A.last_decision[sym], pos = A.positions[sym];
    var closes = A.closes[sym] || [];
    var prev = closes.length ? closes[closes.length - 1][1] : null;
    var chg = lp && prev ? lp.price / prev - 1 : null;
    var card = document.createElement("section"); card.className = "card";
    var chips = "";
    if (dec) {
      var a = dec.action.toLowerCase();
      chips = '<span class="chip ' + (a === "buy" || a === "sell" ? a : "") + '">' + dec.action + " · p " + Math.round(dec.probability * 100) + "%</span>" +
        '<span class="chip ' + (dec.gate === "EXECUTE" ? "exec" : "") + '">' + (dec.gate === "EXECUTE" ? "executed" : "skipped") + "</span>" +
        '<span class="muted" style="font-size:12px">signal from ' + esc(dec.bar) + " close · " + esc(dec.regime) + "</span>";
    } else { chips = '<span class="muted" style="font-size:12px">no signal yet</span>'; }
    card.innerHTML =
      '<div class="inst-head"><div style="display:grid;gap:4px"><div class="sym"><span class="swatch" style="background:' + COLOR[sym] + '"></span><b>' + sym + "</b></div>" +
      '<span class="muted" style="font-size:12.5px">' + esc(SPEC[sym].name) + "</span></div>" +
      '<div><div class="price">' + (lp ? px(sym, lp.price) : "–") + "</div>" +
      '<div class="num ' + (chg != null ? cls(chg) : "") + '" style="text-align:right;font-size:12.5px">' + (chg != null ? pct(chg) + " vs last close" : "") + "</div></div></div>" +
      '<div class="chips">' + chips + "</div>" +
      '<div class="chart" data-sym="' + sym + '"></div>' + positionBlock(sym, pos, lp);
    return card;
  }
  function positionBlock(sym, p, lp) {
    if (!p) return '<div class="flat">No open position. The bot opens one when a new daily signal passes the risk gate.</div>';
    var pnl = lp ? pnlOf(p, lp.price) : 0, r = riskOf(p);
    var pips = lp ? (exitFill(p, lp.price) - p.entry) * (p.side === "BUY" ? 1 : -1) / SPEC[sym].pip : 0;
    var held = (A.closes[sym] || []).filter(function (c) { return c[0] > p.opened_at.slice(0, 10); }).length;
    var maxHold = (D.config && D.config.max_hold) || 20;
    return '<div class="position">' +
      '<div><span class="label">Side</span><span class="v"><span class="chip ' + p.side.toLowerCase() + '">' + p.side + "</span></span></div>" +
      '<div><span class="label">Entry</span><span class="v">' + px(sym, p.entry) + "</span></div>" +
      '<div><span class="label">Stop</span><span class="v neg">' + px(sym, p.stop) + "</span></div>" +
      '<div><span class="label">Target</span><span class="v pos">' + px(sym, p.target) + "</span></div>" +
      '<div><span class="label">P&amp;L</span><span class="v ' + cls(pnl) + '">' + money(pnl, true) + "</span></div>" +
      '<div><span class="label">Pips</span><span class="v ' + cls(pnl) + '">' + (pips > 0 ? "+" : "") + pips.toFixed(1) + "</span></div>" +
      '<div><span class="label">R multiple</span><span class="v ' + cls(pnl) + '">' + (r ? (pnl / r).toFixed(2) : "0.00") + "R</span></div>" +
      '<div style="grid-column:1/-1"><span class="label">Held ' + held + " of " + maxHold + " trading days · opened " + esc(stamp(p.opened_at)) + '</span><div class="bar"><i style="width:' + Math.min(100, 100 * held / maxHold) + '%"></i></div></div>' +
      "</div>";
  }
  function drawPrices() {
    document.querySelectorAll(".chart[data-sym]").forEach(function (box) {
      var sym = box.dataset.sym, p = A.positions[sym];
      var pts = (A.closes[sym] || []).map(function (c) { return { x: new Date(c[0] + "T00:00:00Z"), y: c[1], label: c[0] + "  " + px(sym, c[1]) }; });
      var levels = p ? [
        { y: p.target, color: "var(--good)", label: "target " + px(sym, p.target), dash: "5 3" },
        { y: p.entry, color: "var(--ink-2)", label: p.side.toLowerCase() + " " + px(sym, p.entry) },
        { y: p.stop, color: "var(--bad)", label: "stop " + px(sym, p.stop), dash: "5 3" }
      ] : [];
      lineChart(box, pts, {
        height: 170, color: COLOR[sym], levels: levels, left: sym === "EURUSD" ? 58 : 50, aria: sym + " daily closes",
        empty: "Daily prices appear after the first check.",
        yfmt: function (v) { return sym === "EURUSD" ? v.toFixed(3) : Math.round(v).toLocaleString("en-US"); },
        xfmt: function (d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
      });
    });
  }

  var inst = $("instruments");
  SYMS.forEach(function (s) { inst.appendChild(instrumentPanel(s)); });

  // ---- closed trades (with filters) ----
  var REASON = { stop: "stop-loss", target: "target", time: "time limit", reverse: "signal flipped", end: "end" };
  function renderTrades() {
    var fp = $("f-pair").value, fs = $("f-side").value, fr = $("f-result").value;
    var rowsData = closed.slice().reverse().filter(function (t) {
      return (!fp || t.symbol === fp) && (!fs || t.side === fs) && (!fr || (fr === "win" ? t.pnl > 0 : t.pnl <= 0));
    });
    var net = rowsData.reduce(function (a, t) { return a + t.pnl; }, 0), w = rowsData.filter(function (t) { return t.pnl > 0; }).length;
    $("f-total").innerHTML = rowsData.length + " trade" + (rowsData.length === 1 ? "" : "s") + " · " + w + " won · net <span class='" + cls(net) + "'>" + money(net, true) + "</span>";
    if (!rowsData.length) { $("trades").innerHTML = '<div class="empty">No trades match these filters.</div>'; return; }
    var rows = rowsData.map(function (t) {
      var r = riskOf(t);
      return "<tr><td class='l'>" + esc((t.closed_at || "").slice(0, 10)) + "</td>" +
        "<td class='l'><span class='sym'><span class='swatch' style='background:" + COLOR[t.symbol] + "'></span>" + t.symbol + "</span></td>" +
        "<td><span class='chip " + t.side.toLowerCase() + "'>" + t.side + "</span></td>" +
        "<td class='r'>" + px(t.symbol, t.entry) + "</td><td class='r'>" + px(t.symbol, t.exit) + "</td>" +
        "<td class='l'>" + (REASON[t.reason] || esc(t.reason)) + "</td>" +
        "<td class='r " + cls(t.pnl) + "'>" + (t.pips > 0 ? "+" : "") + t.pips.toFixed(1) + "</td>" +
        "<td class='r " + cls(t.pnl) + "'>" + (r ? (t.pnl / r).toFixed(2) + "R" : "–") + "</td>" +
        "<td class='r " + cls(t.pnl) + "'>" + money(t.pnl, true) + "</td></tr>";
    }).join("");
    $("trades").innerHTML = "<table><thead><tr><th class='l'>Closed</th><th class='l'>Pair</th><th>Side</th><th class='r'>Entry</th><th class='r'>Exit</th><th class='l'>Why</th><th class='r'>Pips</th><th class='r'>R</th><th class='r'>P&amp;L</th></tr></thead><tbody>" + rows + "</tbody></table>";
  }
  $("trade-count").textContent = closed.length ? closed.length + " total" : "";
  if (!closed.length) {
    $("trades").innerHTML = '<div class="empty">No closed trades yet. Each trade closes at its stop, its target, after ' + ((D.config && D.config.max_hold) || 20) + " trading days, or when the signal flips.</div>";
  } else {
    $("filters").hidden = false;
    ["f-pair", "f-side", "f-result"].forEach(function (id) { $(id).addEventListener("change", renderTrades); });
    renderTrades();
  }

  // ---- activity ----
  var ev = (A.events || []).slice(-60).reverse();
  $("log").innerHTML = ev.length ? ev.map(function (e) {
    return "<div><time>" + esc(stamp(e[0])) + "</time><span>" + esc(e[1]) + "</span></div>";
  }).join("") : '<div class="empty" style="display:block">Nothing yet. Each check adds a line here.</div>';

  // ---- research loop (kill switch, prediction vs reality, critic, ledger) ----
  if (window.renderResearch) window.renderResearch($("rl-box"), D.research, { fullLedger: true });
  else $("research").hidden = true;
  var KS = D.research && D.research.killswitch;
  if (KS && KS.state === "halted") {
    $("banner").hidden = false;
    $("banner").textContent = "No new trades: " + KS.reason + ". Open positions keep their stops." + (D.note ? " " + D.note : "");
  }

  // ---- rules ----
  var C = D.config || {};
  $("rules").innerHTML = [
    "Risk " + ((C.risk_pct || 0.01) * 100).toFixed(1) + "% per trade",
    "Stop " + (C.sl_atr || 1.5) + " × ATR",
    "Target " + (C.tp_atr || 3) + " × ATR",
    "Max hold " + (C.max_hold || 20) + " days",
    "Spread: gold $" + SPEC.XAUUSD.spread.toFixed(2) + ", EUR/USD " + (SPEC.EURUSD.spread / SPEC.EURUSD.pip).toFixed(0) + " pip",
    "One decision per trading day"
  ].map(function (t) { return "<span>" + t + "</span>"; }).join("");

  function draw() { drawEquity(); drawPnl(); drawPrices(); }
  draw();
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(draw, 120); });
  if (D.auto_refresh_min) setTimeout(function () { location.reload(); }, D.auto_refresh_min * 60000);
})();
</script>
