# The research loop's GitHub side.
#
#   Every Saturday   the research agents (Price Analyst, Macro Watcher, Central-Bank Reader,
#                    then the Skeptic) read the ledger and propose new ideas into it.
#                    Needs the ANTHROPIC_API_KEY secret; skipped without it.
#   Every Sunday     the weekly critic reads the paper accounts and the decision journal,
#                    compares them with the backtests and written predictions, and writes
#                    state/reviews/ and the ledger.
#   Run workflow     (Actions tab -> research -> Run workflow) with one command:
#                      agents               the research agents, right now
#                      review               the critic, right now
#                      backtest H1          honest development-period backtest on real
#                                           daily history (Yahoo, 10 years)
#                      sealed H1            the ONE run on the sealed newest 25% of history
#
# Results land in state/ledger.json and both dashboards are rebuilt.
# Scalper (1-minute) backtests need MT5 history and run on the Windows PC instead.

name: research

on:
  schedule:
    - cron: "47 6 * * 6"          # Saturdays 06:47 UTC: research agents
    - cron: "47 7 * * 0"          # Sundays 07:47 UTC, after the forex week has closed: the critic
  workflow_dispatch:
    inputs:
      command:
        description: "agents · review · backtest H1 · sealed H1 (sealed runs once per idea, ever)"
        required: true
        default: "review"

permissions:
  contents: write
  actions: write                  # to start the dashboard rebuild afterwards

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the research command
        env:
          CMD: ${{ github.event.inputs.command || (github.event.schedule == '47 6 * * 6' && 'agents') || 'review' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
        run: |
          set -e
          [ -n "$RESEARCH_MODEL" ] || unset RESEARCH_MODEL
          read -r VERB ID REST <<< "$CMD"
          case "$VERB" in
            agents)          python -m jev_bot research agents ;;
            review)          python -m jev_bot research review ;;
            backtest|sealed) [[ "$ID" =~ ^[Hh][0-9]+$ ]] || { echo "usage: $VERB H1"; exit 1; }
                             python -m jev_bot research "$VERB" "$ID" --source yahoo --range 10y ;;
            *)               echo "unknown command '$CMD': use agents, review, backtest H1 or sealed H1"; exit 1 ;;
          esac

      - name: Save the ledger and the review
        run: |
          git config user.name  "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add state/ledger.json state/reviews
          git add research 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "research: ${{ github.event.inputs.command || 'weekly review' }} $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Rebuild the dashboards
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paper-trade.yml --ref main
