# Runs the paper-trading bot in GitHub's cloud every hour and publishes the
# dashboard to GitHub Pages. Real prices (Yahoo Finance), fake money.
# Nothing here can place a real trade: there is no broker code in this repo.

name: paper-trade

on:
  schedule:
    - cron: "17 * * * *"          # every hour at :17 (UTC). GitHub may run it a few minutes late.
  workflow_dispatch:               # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write                  # to save the account file back to the repo
  pages: write
  id-token: write

concurrency:
  group: paper-trade               # never run two checks at the same time
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one paper-trading check
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}   # optional
        run: |
          SOURCE=yahoo
          if [ -n "$TWELVEDATA_API_KEY" ]; then SOURCE=twelvedata; fi
          python -m jev_bot live --source "$SOURCE" \
            --account state/paper_account.json \
            --dashboard docs/index.html

      - name: Save the account
        run: |
          git config user.name  "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add state/paper_account.json
          git diff --cached --quiet || git commit -m "paper check $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
