# The paper-trading bot's GitHub side. Real prices (Yahoo Finance), fake money.
# Nothing here can place a real trade: there is no broker code in this repo.
#
# Who trades is set by state/runner.txt:
#   github  (or no file)  GitHub runs one check every hour and publishes the dashboard.
#   server                An always-on server trades every minute and pushes the account
#                         here every 15 min. GitHub then only rebuilds the dashboard, and
#                         each hour checks the server is alive: if it has gone quiet while
#                         the market is open, the run fails (red X) and GitHub emails you.

name: paper-trade

on:
  schedule:
    - cron: "17 * * * *"          # hourly at :17 UTC (GitHub may run it late or skip some)
  workflow_dispatch:               # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["state/paper_account.json", "state/runner.txt", "state/scalper_account.json", "state/scalper_orb.json"]   # the servers' pushes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Who is trading?
        id: mode
        run: |
          RUNNER=$(tr -d '[:space:]' < state/runner.txt 2>/dev/null || true)
          echo "runner=${RUNNER:-github}" >> "$GITHUB_OUTPUT"
          echo "runner: ${RUNNER:-github}"

      - name: Run one paper-trading check (GitHub mode)
        if: steps.mode.outputs.runner != 'server' && github.event_name != 'push'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}   # optional
        run: |
          SOURCE=yahoo
          if [ -n "$TWELVEDATA_API_KEY" ]; then SOURCE=twelvedata; fi
          python -m jev_bot live --source "$SOURCE" --runner github \
            --account state/paper_account.json

      - name: Save the account (GitHub mode)
        if: steps.mode.outputs.runner != 'server' && github.event_name != 'push'
        run: |
          git config user.name  "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add state/paper_account.json
          git diff --cached --quiet || git commit -m "paper check $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Build the dashboards
        run: |
          python -m jev_bot dashboard --account state/paper_account.json --out docs/index.html
          if [ -f state/scalper_account.json ]; then
            python -m jev_bot scalp-dashboard --account state/scalper_account.json --out docs/scalper.html
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Is the server alive? (server mode)
        if: steps.mode.outputs.runner == 'server' && github.event_name == 'schedule'
        run: python -m jev_bot heartbeat --account state/paper_account.json --max-age 45

      - name: Is the scalper alive?
        if: github.event_name == 'schedule' && hashFiles('state/scalper_account.json') != ''
        run: python -m jev_bot heartbeat --account state/scalper_account.json --max-age 45
